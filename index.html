<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannière Échecs Rotative - Capechecs</title>
    <style>
        :root {
            --banner-bg: #000000;
            --card-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent-gold: #f59e0b;
            --banner-height: 90px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            overflow: hidden;
            color: var(--text-primary);
        }

        .banner-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .tournament-header {
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            margin-bottom: 8px;
            background: var(--banner-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .tournament-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .round-info {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .main-banner-frame {
            width: 100%;
            max-width: 950px;
            height: var(--banner-height);
            background: var(--banner-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-viewport {
            position: absolute;
            left: 15px;
            right: 100px;
            top: 0;
            bottom: 0;
            overflow: hidden;
        }

        .match-card {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--banner-bg);
            display: grid;
            grid-template-columns: 70px 1fr 100px 1fr;
            align-items: center;
            opacity: 0;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .match-card.active {
            opacity: 1;
            transform: translateY(0);
        }

        .match-card.exit {
            opacity: 0;
            transform: translateY(-100%);
        }

        .board-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111111;
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            padding: 4px;
            color: var(--accent-gold);
            font-weight: 800;
        }

        .board-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .board-number {
            font-size: 1.2rem;
            line-height: 1;
        }

        .player-box {
            display: flex;
            flex-direction: column;
            padding: 0 12px;
            overflow: hidden;
            min-width: 0;
        }

        .player-box.white {
            text-align: right;
            border-right: 1px solid #222222;
        }

        .player-box.black {
            text-align: left;
            border-left: 1px solid #222222;
        }

        .player-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .player-box.white .player-meta {
            justify-content: flex-end;
        }
