<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannière Échecs Rotative - Capechecs</title>
    <style>
        :root {
            --banner-bg: #000000;
            --card-border: #333333;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent-gold: #f59e0b;
            --banner-height: 90px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body, html {
            width: 100%; height: 100%;
            background-color: #0d0d0d !important;
            overflow: hidden;
            color: var(--text-primary);
        }

        .banner-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 10px; position: relative;
        }

        .tournament-header {
            width: 100%; max-width: 950px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 16px; margin-bottom: 8px;
            background: var(--banner-bg); border: 1px solid var(--card-border);
            border-radius: 8px;
        }

        .tournament-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; }
        .round-info { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }

        .main-banner-frame {
            width: 100%; max-width: 950px; height: var(--banner-height);
            background: var(--banner-bg); border: 1px solid var(--card-border);
            border-radius: 10px; display: flex; align-items: center; position: relative; overflow: hidden;
        }

        .card-viewport { position: absolute; left: 15px; right: 100px; top: 0; bottom: 0; overflow: hidden; }

        .match-card {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: var(--banner-bg); display: grid; grid-template-columns: 70px 1fr 100px 1fr;
            align-items: center; opacity: 1; transform: translateY(0);
        }

        .board-badge {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #111111; border: 1px solid var(--accent-gold); border-radius: 6px; padding: 4px; color: var(--accent-gold); font-weight: 800;
        }

        .board-label { font-size: 0.65rem; text-transform: uppercase; }
        .board-number { font-size: 1.2rem; line-height: 1; }

        .player-box { display: flex; flex-direction: column; padding: 0 12px; }
        .player-box.white { text-align: right; border-right: 1px solid #222222; }
        .player-box.black { text-align: left; border-left: 1px solid #222222; }

        .player-name { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
        .player-box.white .player-meta { justify-content: flex-end; }

        .elo-tag { background: #222222; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .pts-tag { color: var(--accent-gold); font-weight: 600; }

        .score-box {
            display: flex; justify-content: center; align-items: center;
            font-size: 1.25rem; font-weight: 800; background: #111111;
            padding: 6px 12px; border-radius: 6px; border: 1px solid var(--card-border);
            color: var(--accent-gold);
        }

        .config-toggle {
            position: fixed; top: 12px; right: 12px;
            background: var(--accent-gold); color: #000000; border: 2px solid #ffffff;
            border-radius: 6px; padding: 8px 16px; font-size: 0.85rem; font-weight: bold;
            cursor: pointer !important; z-index: 999999 !important;
        }

        .config-panel {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111111; border: 2px solid var(--accent-gold); padding: 20px;
            border-radius: 10px; z-index: 1000000 !important; width: 90%; max-width: 450px; color: #fff;
        }

        .config-panel.open { display: block !important; }
        .config-group { margin-bottom: 12px; }
        .config-panel label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; }
        .config-panel textarea { width: 100%; height: 120px; background: #000; border: 1px solid var(--card-border); color: #fff; border-radius: 4px; font-family: monospace; }
        .config-panel button { background: var(--accent-gold); color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 8px; }
    </style>
</head>
<body>

    <button class="config-toggle" id="btnConfig">⚙ Réglages (ou Touche R)</button>
    
    <div class="config-panel" id="panelConfig">
        <h3 style="color:var(--accent-gold); margin-bottom:10px;">Configuration Bannière</h3>
        <div class="config-group">
            <label>Copier / Coller la grille FFE :</label>
            <textarea id="inputData" placeholder="Collez le texte brut copié sur la FFE..."></textarea>
        </div>
        <button id="btnValider">Valider et Charger</button>
    </div>

    <div class="banner-container">
        <div class="tournament-header">
            <div class="tournament-title" id="tourneyTitle">Capechecs - Tournoi FFE</div>
            <div class="round-info" id="roundInfo">Résultats</div>
        </div>

        <div class="main-banner-frame">
            <div class="card-viewport" id="cardViewport"></div>
        </div>
    </div>

    <script>
        var matchesData = [
            { board: "1", whitePts: "2", whiteName: "RADOMSKYI Vladyslav", whiteElo: "2504 F", result: "1/2", blackName: "MAURIZZI Marc Andria", blackElo: "2624 F", blackPts: "2" }
        ];
        var currentIndex = 0;

        function togglePanel() {
            var p = document.getElementById('panelConfig');
            if (p) p.classList.toggle('open');
        }

        window.onkeydown = function(e) {
            if (e.key === 'r' || e.key === 'R' || e.key === 'c' || e.key === 'C') {
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    togglePanel();
                }
            }
        };

        function parseInput(raw) {
            var clean = raw.replace(/\u00a0/g, ' ');
            var lines = clean.split(/\r?\n/);
            var parsed = [];

            for (var i = 0; i < lines.length; i++) {
                var cols = lines[i].split(/\t+|\s{2,}/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
                if (cols.length >= 7 && !isNaN(parseInt(cols[0]))) {
                    parsed.push({
                        board: cols[0],
                        whitePts: cols[1] || "",
                        whiteName: cols[2] || "",
                        whiteElo: cols[3] || "",
                        result: cols[4] || "VS",
                        blackName: cols[5] || "",
                        blackElo: cols[6] || "",
                        blackPts: cols[7] || ""
                    });
                }
            }

            if (parsed.length > 0) {
                matchesData = parsed;
                currentIndex = 0;
                render();
            }
        }

        function render() {
            if (matchesData.length === 0) return;
            var vp = document.getElementById('cardViewport');
            var m = matchesData[currentIndex];

            var resRaw = m.result ? m.result.replace(/\s+/g, '') : '';
            var resDisplay = m.result;

            if (resRaw === "X-X" || resRaw === "½-½" || resRaw === "1/2-1/2" || resRaw.indexOf("1/2") !== -1 || resRaw.indexOf("X-X") !== -1 || resRaw.indexOf("½-½") !== -1) {
                resDisplay = "1/2";
            } else if (!resRaw || resRaw === "-" || resRaw === "VS") {
                resDisplay = '<span style="font-size:0.85rem; color:#ccc;">VS</span>';
            }

            vp.innerHTML = '' +
                '<div class="match-card">' +
                    '<div class="board-badge">' +
                        '<span class="board-label">Ech.</span>' +
                        '<span class="board-number">' + m.board + '</span>' +
                    '</div>' +
                    '<div class="player-box white">' +
                        '<div class="player-name">' + m.whiteName + '</div>' +
                        '<div class="player-meta">' +
                            '<span class="pts-tag">' + m.whitePts + ' pts</span>' +
                            '<span class="elo-tag">' + m.whiteElo + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="score-box">' + resDisplay + '</div>' +
                    '<div class="player-box black">' +
                        '<div class="player-name">' + m.blackName + '</div>' +
                        '<div class="player-meta">' +
                            '<span class="elo-tag">' + m.blackElo + '</span>' +
                            '<span class="pts-tag">' + m.blackPts + ' pts</span>' +
                        '</div>' +
                    '</div>' +
                '</div>';

            currentIndex = (currentIndex + 1) % matchesData.length;
        }

        window.onload = function() {
            var btnToggle = document.getElementById('btnConfig');
            var btnValider = document.getElementById('btnValider');

            if (btnToggle) btnToggle.onclick = togglePanel;
            if (btnValider) {
                btnValider.onclick = function() {
                    var txt = document.getElementById('inputData').value;
                    if (txt.trim().length > 0) {
                        parseInput(txt);
                    }
                    togglePanel();
                };
            }

            render();
            setInterval(render, 4500);
        };
    </script>
</body>
</html>
