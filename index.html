<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeau Résultats Échecs vMix - CAPECHECS</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome / Phosphor Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: transparent;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Style du conteneur de défilement */
    .ticker-viewport {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Animation pas-à-pas verticale */
    .ticker-card {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(100%);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease-in-out;
      pointer-events: none;
    }

    .ticker-card.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .ticker-card.exit {
      opacity: 0;
      transform: translateY(-100%);
    }

    /* Gradient or/doré spécial Capechecs */
    .gold-gradient-text {
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-bg {
      background: linear-gradient(135deg, #BF953F 0%, #E6C670 50%, #AA771C 100%);
    }

    /* Masquer le panneau de config en mode overlay propre */
    .config-panel {
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .config-panel.collapsed {
      transform: translateY(-110%);
      opacity: 0.2;
    }
    .config-panel.collapsed:hover {
      opacity: 1;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-end p-2 select-none">

  <!-- PANNEAU DE CONFIGURATION (Rétractable) -->
  <div id="configPanel" class="config-panel fixed top-2 left-2 right-2 z-50 bg-slate-900/95 text-white p-3 rounded-xl border border-amber-500/30 shadow-2xl backdrop-blur-md text-xs flex flex-wrap gap-3 items-center justify-between">
    <div class="flex items-center gap-2 font-bold text-amber-400">
      <i class="fa-solid fa-gear text-sm"></i>
      <span>Configuration Live FFE</span>
    </div>

    <div class="flex-1 min-w-[300px] flex gap-2">
      <input type="text" id="ffeUrlInput" 
             value="https://www.echecs.asso.fr/Resultats.aspx?URL=Tournois/Id/73391/73391&Action=01" 
             placeholder="Coller l'URL FFE de la ronde ici..." 
             class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-white focus:outline-none focus:border-amber-400 font-mono">
      <button onclick="updateSource()" class="gold-bg text-black font-bold px-4 py-1.5 rounded hover:brightness-110 transition">
        Charger
      </button>
    </div>

    <div class="flex items-center gap-4">
      <label class="flex items-center gap-1.5 cursor-pointer">
        <span class="text-slate-400">Durée/Carte:</span>
        <input type="number" id="durationInput" value="5" min="2" max="20" class="w-12 bg-slate-800 border border-slate-700 rounded text-center py-1 text-amber-300">
        <span class="text-slate-400">sec</span>
      </label>

      <div class="flex items-center gap-2 border-l border-slate-700 pl-3">
        <span id="statusIndicator" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="statusText" class="text-slate-300">Connexion...</span>
      </div>

      <button onclick="toggleConfig()" class="text-slate-400 hover:text-white ml-2" title="Masquer le panneau">
        <i class="fa-solid fa-chevron-up text-base"></i>
      </button>
    </div>
  </div>

  <!-- BOUTON RE-OUVERTURE CONFIG SI MASQUÉ -->
  <button id="openConfigBtn" onclick="toggleConfig()" class="fixed top-2 right-2 z-40 bg-slate-900/80 text-amber-400 p-2 rounded-lg border border-amber-500/30 text-xs hidden hover:bg-slate-900">
    <i class="fa-solid fa-gear"></i> URL FFE
  </button>

  <!-- BANDEAU / RUBAN PRINCIPAL INFOS (Fit dans le cadre "Infos" bas) -->
  <div class="w-full h-24 bg-slate-950/95 border-2 border-amber-500/50 rounded-2xl shadow-2xl flex items-center overflow-hidden relative backdrop-blur-sm">
    
    <!-- Étiquette gauche "RONDE LIVE" -->
    <div class="h-full px-6 bg-amber-500/10 border-r border-amber-500/30 flex flex-col justify-center items-center min-w-[130px] shrink-0">
      <span class="text-amber-400 font-black text-xs tracking-widest uppercase">RONDE LIVE</span>
      <span id="boardCount" class="text-white/60 text-[10px] font-semibold mt-0.5">Chargement...</span>
    </div>

    <!-- ZONE D'ANIMATION DE DÉFILEMENT (VIEWPORT) -->
    <div class="flex-1 h-full relative px-6" id="tickerViewport">
      
      <!-- État d'attente/chargement -->
      <div id="loadingState" class="absolute inset-0 flex items-center justify-center gap-3 text-amber-400/80">
        <i class="fa-solid fa-circle-notch animate-spin text-xl"></i>
        <span class="font-bold text-sm tracking-wide">Récupération des données FFE en cours...</span>
      </div>

    </div>

    <!-- LOGO / DECO DROITE -->
    <div class="h-full px-5 border-l border-amber-500/20 flex items-center justify-center shrink-0 bg-slate-900/50">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-chess-king text-2xl text-amber-400"></i>
        <div class="text-left hidden lg:block">
          <div class="font-black text-xs text-white leading-none">CAPECHECS</div>
          <div class="text-[9px] text-amber-400/80 tracking-wider font-semibold">CAP D'AGDE</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Variables globales
    let gamesData = [];
    let currentIndex = 0;
    let slideTimer = null;
    let refreshTimer = null;
    let displayDuration = 5000; // 5 secondes par échiquier
    let currentFfeUrl = "";

    // Démarrage automatique
    window.addEventListener('DOMContentLoaded', () => {
      // Détecter si une URL est passée en paramètre URL (?url=...)
      const urlParams = new URLSearchParams(window.location.search);
      const urlParam = urlParams.get('url');
      const durationParam = urlParams.get('duration');

      if (durationParam && !isNaN(durationParam)) {
        displayDuration = parseInt(durationParam) * 1000;
        document.getElementById('durationInput').value = durationParam;
      }

      if (urlParam) {
        currentFfeUrl = decodeURIComponent(urlParam);
        document.getElementById('ffeUrlInput').value = currentFfeUrl;
      } else {
        currentFfeUrl = document.getElementById('ffeUrlInput').value;
      }

      // Écouteur pour la durée
      document.getElementById('durationInput').addEventListener('change', (e) => {
        displayDuration = Math.max(2, parseInt(e.target.value) || 5) * 1000;
        restartAnimation();
      });

      // Lancer la première mise à jour
      fetchFFEData();

      // Programmer le rafraîchissement automatique FFE en arrière-plan (toutes les 45 secondes)
      refreshTimer = setInterval(fetchFFEData, 45000);
    });

    // Masquer / Afficher le panneau de configuration
    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      const btn = document.getElementById('openConfigBtn');
      panel.classList.toggle('collapsed');
      if (panel.classList.contains('collapsed')) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    }

    // Mise à jour de l'URL manuellement depuis l'interface
    function updateSource() {
      const inputUrl = document.getElementById('ffeUrlInput').value.trim();
      if (!inputUrl) return;
      currentFfeUrl = inputUrl;
      
      document.getElementById('statusIndicator').className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
      document.getElementById('statusText').textContent = "Mise à jour...";
      
      fetchFFEData();
    }

    // Récupération multi-proxys très robuste pour contourner CORS et erreurs serveur
    async function fetchFFEData() {
      if (!currentFfeUrl) return;

      const targetUrl = currentFfeUrl;

      // Liste mise à jour de proxys performants
      const proxies = [
        {
          name: "CorsDev",
          fetch: async (url) => {
            const res = await fetch(`https://proxy.cors.dev/${url}`, { signal: AbortSignal.timeout(6000) });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
          }
        },
        {
          name: "CodeTabs",
          fetch: async (url) => {
            const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(6000) });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
          }
        },
        {
          name: "AllOrigins",
          fetch: async (url) => {
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}&ts=${Date.now()}`, { signal: AbortSignal.timeout(6000) });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            return json.contents;
          }
        },
        {
          name: "CorsProxy",
          fetch: async (url) => {
            const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, { signal: AbortSignal.timeout(6000) });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
          }
        }
      ];

      let htmlContent = null;
      let successfulProxy = null;

      for (const proxy of proxies) {
        try {
          console.log(`[FFE Fetch] Tentative via ${proxy.name}...`);
          htmlContent = await proxy.fetch(targetUrl);
          if (htmlContent && htmlContent.length > 300) {
            successfulProxy = proxy.name;
            break;
          }
        } catch (err) {
          console.warn(`[FFE Fetch] Échec avec ${proxy.name}:`, err.message);
        }
      }

      if (htmlContent) {
        console.log(`[FFE Fetch] Succès via ${successfulProxy}!`);
        parseFFEHtml(htmlContent);
        document.getElementById('statusIndicator').className = "inline-block w-2.5 h-2.5 rounded-full bg-emerald-500";
        document.getElementById('statusText').textContent = `En direct (${gamesData.length} p.)`;
      } else {
        console.warn("[FFE Fetch] Tous les proxys réseau ont échoué. Basculement en mode secours/démo.");
        
        // En cas d'échec complet du réseau FFE, utiliser les données courantes ou charger la démo
        if (gamesData.length === 0) {
          loadFallbackDemoData();
        }
        document.getElementById('statusIndicator').className = "inline-block w-2.5 h-2.5 rounded-full bg-amber-500";
        document.getElementById('statusText').textContent = "Mode Démo / Hors-ligne";
      }
    }

    // Parser le tableau HTML retourné par la FFE
    function parseFFEHtml(htmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      
      const tables = doc.querySelectorAll('table');
      let targetTable = null;

      tables.forEach(table => {
        const text = table.textContent;
        if (text.includes('Ech.') || text.includes('Pts') || text.includes('Blancs')) {
          targetTable = table;
        }
      });

      if (!targetTable) {
        console.warn("Tableau FFE non trouvé dans le HTML fourni.");
        if (gamesData.length === 0) loadFallbackDemoData();
        return;
      }

      const rows = targetTable.querySelectorAll('tr');
      const newGames = [];

      rows.forEach((row) => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 7) {
          const ech = cells[0]?.textContent?.trim();
          
          if (ech && !isNaN(parseInt(ech))) {
            const ptsW = cells[1]?.textContent?.trim() || "0";
            const nameW = cleanPlayerName(cells[2]?.textContent?.trim() || "");
            const eloW = cells[3]?.textContent?.trim() || "";
            const res = cells[4]?.textContent?.trim() || "VS";
            const nameB = cleanPlayerName(cells[5]?.textContent?.trim() || "");
            const eloB = cells[6]?.textContent?.trim() || "";
            const ptsB = cells[7]?.textContent?.trim() || "0";

            newGames.push({
              board: ech,
              white: { name: nameW, elo: cleanElo(eloW), pts: ptsW },
              black: { name: nameB, elo: cleanElo(eloB), pts: ptsB },
              result: formatResult(res)
            });
          }
        }
      });

      if (newGames.length > 0) {
        gamesData = newGames;
        document.getElementById('boardCount').textContent = `${gamesData.length} Échiquiers`;
        updateTickerUI();
      } else if (gamesData.length === 0) {
        loadFallbackDemoData();
      }
    }

    // Nettoyer le format des Elo
    function cleanElo(eloStr) {
      if (!eloStr) return "";
      return eloStr.replace(/\s*[FEN]/g, '').trim();
    }

    // Nettoyer les noms de joueurs
    function cleanPlayerName(str) {
      if (!str) return "Joueur Inconnu";
      return str.replace(/\s+/g, ' ').trim();
    }

    // Formater le résultat pour l'affichage TV
    function formatResult(res) {
      if (!res || res === "X" || res.includes("&nbsp;") || res.trim() === "") return "VS";
      if (res === "1 - 0" || res === "1-0") return "1 — 0";
      if (res === "0 - 1" || res === "0-1") return "0 — 1";
      if (res === "½ - ½" || res === "1/2-1/2" || res === "1/2 - 1/2" || res === "X-X") return "½ — ½";
      return res;
    }

    // Mettre à jour les cartes HTML dans le viewport
    function updateTickerUI() {
      const viewport = document.getElementById('tickerViewport');
      viewport.innerHTML = '';

      if (gamesData.length === 0) return;

      gamesData.forEach((game, idx) => {
        const card = document.createElement('div');
        card.className = `ticker-card ${idx === 0 ? 'active' : ''}`;
        card.id = `card-${idx}`;

        card.innerHTML = `
          <!-- ÉCHIQUIER BADGE -->
          <div class="flex items-center gap-2 min-w-[90px]">
            <span class="text-amber-400/70 font-bold text-xs uppercase tracking-wider">ÉCH.</span>
            <span class="gold-bg text-black font-black text-xl px-2.5 py-0.5 rounded-lg shadow-md">${game.board}</span>
          </div>

          <!-- JOUEUR BLANCS -->
          <div class="flex-1 flex items-center justify-end gap-3 text-right pr-4 border-r border-slate-800">
            <div>
              <div class="text-white font-bold text-base tracking-tight leading-none">${game.white.name}</div>
              <div class="text-slate-400 text-xs font-semibold mt-1">
                <span class="text-amber-400/90 font-mono">${game.white.elo} ELO</span> 
                <span class="mx-1 opacity-40">•</span> 
                <span class="text-slate-300 font-bold">${game.white.pts} pts</span>
              </div>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-900 font-black text-sm flex items-center justify-center shadow-inner shrink-0 border-2 border-white">
              B
            </div>
          </div>

          <!-- RÉSULTAT / SCORE CENTRAL -->
          <div class="px-6 flex flex-col items-center justify-center min-w-[120px]">
            <div class="bg-slate-900 border border-amber-500/40 px-4 py-1.5 rounded-xl shadow-lg">
              <span class="text-amber-300 font-black text-lg tracking-wider">${game.result}</span>
            </div>
          </div>

          <!-- JOUEUR NOIRS -->
          <div class="flex-1 flex items-center justify-start gap-3 text-left pl-4 border-l border-slate-800">
            <div class="w-8 h-8 rounded-full bg-slate-900 text-amber-400 font-black text-sm flex items-center justify-center border border-amber-500/40 shadow-inner shrink-0">
              N
            </div>
            <div>
              <div class="text-white font-bold text-base tracking-tight leading-none">${game.black.name}</div>
              <div class="text-slate-400 text-xs font-semibold mt-1">
                <span class="text-slate-300 font-bold">${game.black.pts} pts</span>
                <span class="mx-1 opacity-40">•</span> 
                <span class="text-amber-400/90 font-mono">${game.black.elo} ELO</span>
              </div>
            </div>
          </div>
        `;

        viewport.appendChild(card);
      });

      currentIndex = 0;
      restartAnimation();
    }

    // Gestionnaire de la boucle d'animation verticale pas-à-pas
    function restartAnimation() {
      if (slideTimer) clearInterval(slideTimer);
      if (gamesData.length <= 1) return;

      slideTimer = setInterval(() => {
        const total = gamesData.length;
        const currentCard = document.getElementById(`card-${currentIndex}`);
        
        const nextIndex = (currentIndex + 1) % total;
        const nextCard = document.getElementById(`card-${nextIndex}`);

        if (currentCard && nextCard) {
          currentCard.classList.remove('active');
          currentCard.classList.add('exit');

          nextCard.classList.remove('exit');
          nextCard.classList.add('active');

          setTimeout(() => {
            currentCard.classList.remove('exit');
          }, 600);

          currentIndex = nextIndex;
        }
      }, displayDuration);
    }

    // Données de démonstration si le réseau FFE est temporairement indisponible
    function loadFallbackDemoData() {
      gamesData = [
        { board: "1", white: { name: "RATIER-FONTANA Matteo", elo: "2214", pts: "0" }, black: { name: "PANTALACCI Antoine Marie", elo: "1497", pts: "0" }, result: "1 — 0" },
        { board: "2", white: { name: "CASTRO PINTO Miguel Angelo", elo: "1436", pts: "0" }, black: { name: "UTRERA Ludovic", elo: "2153", pts: "0" }, result: "0 — 1" },
        { board: "3", white: { name: "CRISTOFARI Antoine", elo: "2053", pts: "0" }, black: { name: "BOULANGER Capucine", elo: "1432", pts: "0" }, result: "1 — 0" },
        { board: "4", white: { name: "MACHECOURT Teano", elo: "1431", pts: "0" }, black: { name: "APPIETTO Andria", elo: "1962", pts: "0" }, result: "0 — 1" },
        { board: "5", white: { name: "PARIS Romain", elo: "1951", pts: "0" }, black: { name: "FRANCHI Ange Marie", elo: "1421", pts: "0" }, result: "1 — 0" }
      ];
      document.getElementById('boardCount').textContent = `${gamesData.length} Échiquiers (R1)`;
      updateTickerUI();
    }
  </script>
</body>
</html>
